name: Sync Fork
on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0 点 (北京时间 8 点)
  workflow_dispatch: # 支持手动触发
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 关键步骤1：使用 checkout 并关闭持久化凭证
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false # 必须设置为 false

      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          upstream_sync_repo: Kianuni/Erosion-CN
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          # 关键步骤2：允许合并不相关的历史
          upstream_pull_args: '--allow-unrelated-histories'
