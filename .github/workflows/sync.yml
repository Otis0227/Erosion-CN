name: Sync Fork
on:
  schedule:
    - cron: '0 0 * * *' # 每天 0 点
  workflow_dispatch: # 支持手动触发
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: aormsby/Fork-Sync-With-Upstream-action@v3
        with:
          upstream_repository: Kianuni/Erosion-CN  
          upstream_branch: main # 上游分支名
          target_branch: main # 你Fork仓库的分支名
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
